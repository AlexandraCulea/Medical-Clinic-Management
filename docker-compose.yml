services:
  mysql:
    image: mysql:8.0
    container_name: clinica-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: clinica
      MYSQL_USER: app
      MYSQL_PASSWORD: app123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
