<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pacient.pacientId == null ? 'Adaugă Pacient Nou' : 'Editează Pacient'}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5" style="max-width: 600px;">
        <h1 th:text="${pacient.pacientId == null ? 'Adaugă Pacient Nou' : 'Editează Pacient'}"></h1>
        
        <form th:object="${pacient}" th:action="@{/pacienti/save}" method="post">

            <input type="hidden" th:field="*{pacientId}" />

            <div class="mb-3">
                <label for="nume" class="form-label">Nume Pacient</label>
                <input type="text" id="nume" th:field="*{numePacient}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="prenume" class="form-label">Prenume Pacient</label>
                <input type="text" id="prenume" th:field="*{prenumePacient}" class="form-control" required>
            </div>
            
            <div class="mb-3">
                <label for="cnp" class="form-label">CNP</label>
                <input type="text" id="cnp" th:field="*{cnp}" class="form-control" required>
            </div>
            
            <div class="mb-3">
                <label for="adresa" class="form-label">Adresa</label>
                <input type="text" id="adresa" th:field="*{adresa}" class="form-control">
            </div>
            
            <div class="mb-3">
                <label for="asigurare" class="form-label">Tip Asigurare</label>
                <input type="text" id="asigurare" th:field="*{asigurare}" class="form-control">
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-primary" 
                        th:text="${pacient.pacientId == null ? 'Salvează Pacient' : 'Actualizează Pacient'}">
                    Salvează
                </button>
                <a href="/pacienti" class="btn btn-secondary">Anulează și Mergi la Listă</a>
            </div>
        </form>
    </div>
</body>
</html>
