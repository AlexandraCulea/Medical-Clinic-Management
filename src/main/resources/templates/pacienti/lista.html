<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
                xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Lista Pacienți</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5">
        <h1>Lista Pacienților</h1>
        <a href="/pacienti/form" class="btn btn-success mb-3">+ Adaugă Pacient Nou</a>
        <a href="/medicamente" class="btn btn-warning ms-2">💊 Gestiune Medicamente</a>
        
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nume</th>
                    <th>Prenume</th>
                    <th>CNP</th>
                    <th>Acțiuni</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="pacient : ${pacienti}">
                    <td th:text="${pacient.pacientId}"></td>
                    <td th:text="${pacient.numePacient}"></td>
                    <td th:text="${pacient.prenumePacient}"></td>
                    <td th:text="${pacient.cnp}"></td>
                    <td>
                        <a th:href="@{/pacienti/form(id=${pacient.pacientId})}" class="btn btn-sm btn-primary">Editează</a>
                        
                        <a th:href="@{/pacienti/delete/{id}(id=${pacient.pacientId})}" class="btn btn-sm btn-danger"
                            sec:authorize="hasRole('ADMIN')" 
                            onclick="return confirm('Ești sigur că vrei să ștergi?')">Șterge</a>
                        
                        <a th:href="@{/vizite(pacientId=${pacient.pacientId})}" class="btn btn-sm btn-info">
                            Vezi Vizite & Consultații
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <a href="/logout" class="btn btn-warning mt-4">Deconectare</a>
    </div>
</body>
</html>
