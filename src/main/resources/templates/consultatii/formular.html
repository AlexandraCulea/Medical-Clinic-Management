<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Adaugă Consultație</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5" style="max-width: 600px;">
        <h1 th:text="'Prescripție pentru ' + ${pacient.numePacient} + ' ' + ${pacient.prenumePacient}"></h1>
        <hr>

        <form th:object="${request}" th:action="@{/consultatii/save}" method="post">

            <input type="hidden" th:field="*{pacientId}" />

            <div class="mb-3">
                <label for="data" class="form-label">Data Consultației</label>
                <input type="date" id="data" th:field="*{data}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="diagnostic" class="form-label">Diagnostic</label>
                <input type="text" id="diagnostic" th:field="*{diagnostic}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="medicamentId" class="form-label">Medicament Prescris</label>
                <select id="medicamentId" th:field="*{medicamentId}" class="form-select" required>
                    <option value="">-- Selectează Medicament --</option>
                    
                    <option th:each="med : ${medicamente}" 
                            th:value="${med.medicamentId}" 
                            th:text="${med.denumire}">
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <label for="doza" class="form-label">Dozaj (ex: 2/zi, 500mg)</label>
                <input type="text" id="doza" th:field="*{dozaMedicament}" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-success">Prescrie & Salvează</button>
            <a th:href="@{/consultatii(pacientId=${pacient.pacientId})}" class="btn btn-secondary">Anulează</a>
        </form>
    </div>
</body>
</html>
