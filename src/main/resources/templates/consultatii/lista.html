<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
                xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="'Consultații Pacient: ' + ${pacient.numePacient}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5">
        <h1 th:text="'Consultații Pacient: ' + ${pacient.numePacient} + ' ' + ${pacient.prenumePacient}"></h1>
        <hr>
        
        <div th:if="${eroareSecuritate}" class="alert alert-danger">
            <p>🚫 <strong>Acces Refuzat:</strong> <span th:text="${eroareSecuritate}"></span></p>
        </div>

        <a th:href="@{/consultatii/form(pacientId=${pacient.pacientId})}" class="btn btn-success mb-4">
            + Adaugă Consultație Nouă
        </a>
        <a th:href="@{/vizite(pacientId=${pacient.pacientId})}" class="btn btn-secondary mb-4">
            ← Înapoi la Vizite
        </a>
        
        <h2>Istoric Prescripții</h2>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Data</th>
                    <th>Diagnostic</th>
                    <th>Medicament</th>
                    <th>Dozaj</th>
                    <th>Actiuni</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${consultatii}">
                    <td th:text="${c.consultatieId}"></td>
                    
                    <td th:text="${c.data}"></td>
                    <td th:text="${c.diagnostic}"></td>
                    
                    <td th:text="${c.medicament.denumire}"></td> 
                    
                    <td th:text="${c.dozaMedicament}"></td>
                    <td sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/consultatii/delete/{id}(id=${c.consultatieId})}" 
                        class="btn btn-sm btn-danger"
                        onclick="return confirm('Ștergi această consultație?')">
                        Șterge
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
