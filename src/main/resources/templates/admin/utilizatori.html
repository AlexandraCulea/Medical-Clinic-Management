<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panou Administrare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand text-danger" href="#">PANOU ADMIN</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" href="/admin/utilizatori">Gestionare Medici</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/pacienti">🏥 Listă Pacienți & Clinica</a>
                    </li>
                </ul>
                <div class="d-flex">
                    <span class="navbar-text me-3 text-white">
                        Logat ca: <strong sec:authentication="name">Admin</strong>
                    </span>
                    <a href="/logout" class="btn btn-outline-light btn-sm">Deconectare</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <h3>Gestionare Utilizatori (Medici)</h3>
        <hr>
        
        <a href="/admin/utilizatori/form" class="btn btn-primary mb-3">+ Adaugă Medic Nou</a>
        
        <table class="table table-striped table-hover border">
            <thead class="table-secondary">
                <tr>
                    <th>ID</th>
                    <th>User</th>
                    <th>Nume Complet</th>
                    <th>Specializare</th>
                    <th>Rol</th>
                    <th>Acțiuni</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="m : ${medici}">
                    <td th:text="${m.medicId}"></td>
                    <td th:text="${m.username}"></td>
                    <td th:text="${m.numeMedic} + ' ' + ${m.prenumeMedic}"></td>
                    <td th:text="${m.specializare}"></td>
                    <td>
                        <span class="badge bg-info text-dark" th:if="${m.role == 'MEDIC'}">MEDIC</span>
                        <span class="badge bg-danger" th:if="${m.role == 'ADMIN'}">ADMIN</span>
                    </td>
                    <td>
                        <a th:href="@{/admin/utilizatori/form(id=${m.medicId})}" class="btn btn-sm btn-warning">Editează</a>
                        <a th:href="@{/admin/utilizatori/delete/{id}(id=${m.medicId})}" 
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Sigur ștergi acest cont?')">Șterge</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
