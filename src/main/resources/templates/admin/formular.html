<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestionare Medic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5" style="max-width: 500px;">
        <h2>Date Cont Medic</h2>
        <hr>

        <form th:object="${medic}" th:action="@{/admin/utilizatori/save}" method="post">
            
            <input type="hidden" th:field="*{medicId}" />

            <div class="mb-3">
                <label class="form-label">Nume</label>
                <input type="text" th:field="*{numeMedic}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Prenume</label>
                <input type="text" th:field="*{prenumeMedic}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Specializare</label>
                <input type="text" th:field="*{specializare}" class="form-control">
            </div>

            <hr>
            <div class="mb-3">
                <label class="form-label">Username (Unic)</label>
                <input type="text" th:field="*{username}" class="form-control" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Parolă</label>
                <input type="password" th:field="*{password}" class="form-control" required>
                <small class="text-muted">Introduceți parola (va fi criptată automat).</small>
            </div>

            <div class="mb-3">
                <label class="form-label">Rol</label>
                <select th:field="*{role}" class="form-select">
                    <option value="MEDIC">Medic</option>
                    <option value="ADMIN">Administrator</option>
                </select>
            </div>

            <button type="submit" class="btn btn-success w-100">Salvează Utilizator</button>
            <a href="/admin/utilizatori" class="btn btn-secondary w-100 mt-2">Anulează</a>
        </form>
    </div>
</body>
</html>
