<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
                xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Gestiune Medicamente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5">
        <h1>💊 Farmacie / Listă Medicamente</h1>
        <hr>
        
        <a href="/medicamente/form" class="btn btn-success mb-3">+ Adaugă Medicament Nou</a>
        <a href="/pacienti" class="btn btn-secondary mb-3">← Înapoi la Pacienți</a>

        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Denumire</th>
                    <th>Acțiuni</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="m : ${medicamente}">
                    <td th:text="${m.medicamentId}"></td>
                    <td th:text="${m.denumire}"></td>
                    <td>
                        <a th:href="@{/medicamente/form(id=${m.medicamentId})}" class="btn btn-sm btn-primary">Editează</a>
                        <!-- <a th:href="@{/medicamente/delete/{id}(id=${m.medicamentId})}" class="btn btn-sm btn-danger" sec:authorize="hasRole('ADMIN')" >Șterge</a> -->
                        <a th:href="@{/medicamente/delete/{id}(id=${m.medicamentId})}" 
                            class="btn btn-sm btn-danger"
                            sec:authorize="hasRole('ADMIN')"
                            onclick="return confirm('Sigur ștergi acest medicament?')">Șterge</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
