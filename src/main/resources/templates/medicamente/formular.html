<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Medicament</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5" style="max-width: 500px;">
        <h2 th:text="${medicament.medicamentId == null ? 'Adaugă Medicament' : 'Editează Medicament'}"></h2>
        <hr>

        <form th:object="${medicament}" th:action="@{/medicamente/save}" method="post">
            
            <input type="hidden" th:field="*{medicamentId}" />

            <div class="mb-3">
                <label class="form-label">Denumire Medicament</label>
                <input type="text" th:field="*{denumire}" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-success w-100">Salvează</button>
            <a href="/medicamente" class="btn btn-secondary w-100 mt-2">Anulează</a>
        </form>
    </div>
</body>
</html>
