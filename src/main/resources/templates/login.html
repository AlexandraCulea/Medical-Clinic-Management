<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login Clinica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5" style="max-width: 400px;">
        <h2 class="text-center">Autentificare</h2>
        
        <form method="POST" th:action="@{/login}">
            <div th:if="${param.error}" class="alert alert-danger">
                Nume utilizator sau parolă invalidă.
            </div>
            
            <div class="mb-3">
                <label for="username" class="form-label">Utilizator (Admin/Medic)</label>
                <input type="text" id="username" name="username" class="form-control" required>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label">Parolă</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            
            <button type="submit" class="btn btn-primary w-100">Logare</button>
        </form>
    </div>
</body>
</html>
