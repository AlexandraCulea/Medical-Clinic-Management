<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Adaugă Vizită</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5" style="max-width: 600px;">
        <h2 th:text="'Vizită nouă pentru: ' + ${pacient.numePacient} + ' ' + ${pacient.prenumePacient}"></h2>
        <hr>

        <form th:object="${request}" th:action="@{/vizite/save}" method="post">
            
            <input type="hidden" th:field="*{pacientId}" />

            <div class="mb-3">
                <label class="form-label">Data Vizitei</label>
                <input type="date" th:field="*{data}" class="form-control" required />
            </div>

            <div class="mb-3">
                <label class="form-label">Grad de Urgență</label>
                <select th:field="*{urgenta}" class="form-select">
                    <option value="SCAZUTA">Scăzută</option>
                    <option value="MEDIE">Medie</option>
                    <option value="RIDICATA">Ridicată</option>
                    <option value="CRITICA">Critică</option>
                </select>
            </div>

            <button type="submit" class="btn btn-success w-100">Salvează Vizita</button>
            
            <a th:href="@{/vizite(pacientId=${pacient.pacientId})}" class="btn btn-secondary w-100 mt-2">Renunță</a>
        </form>
    </div>
</body>
</html>
