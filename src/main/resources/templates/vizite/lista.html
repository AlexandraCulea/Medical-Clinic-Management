<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
                xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="'Vizite Pacient: ' + ${pacient.numePacient} + ' ' + ${pacient.prenumePacient}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5">
        <h1 th:text="'Vizite Pacient: ' + ${pacient.numePacient} + ' ' + ${pacient.prenumePacient}"></h1>
        <p>CNP: <span th:text="${pacient.cnp}"></span></p>
        <hr>
        
        <a th:href="@{/vizite/form(pacientId=${pacient.pacientId})}" class="btn btn-success mb-4">
            + Înregistrează Vizită Nouă
        </a>

        <a th:href="@{/pacienti}" class="btn btn-secondary mb-4">
            ← Înapoi la Lista Pacienți
        </a>

        <h2>Istoric Vizite</h2>
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>ID Vizită</th>
                    <th>Data Vizitei</th>
                    <th>Medic</th>
                    <th>Urgență</th>
                    <th>Acțiuni</th> 
                </tr>
            </thead>
            <tbody>
                <tr th:each="vizita : ${vizite}">
                    
                    <td th:text="${vizita.vizitaId}"></td> 
                    
                    <td th:text="${vizita.data}"></td>
                    
                    <td>
                        <span th:if="${vizita.medic != null}" 
                              th:text="${vizita.medic.numeMedic} + ' ' + ${vizita.medic.prenumeMedic}">
                        </span>
                        <span th:if="${vizita.medic == null}" class="text-danger">
                            Fără Medic
                        </span>
                    </td> 
                    
                    <td th:text="${vizita.urgenta}"></td>
                    
                    <td>
                        <a th:href="@{/consultatii(pacientId=${pacient.pacientId})}" class="btn btn-sm btn-primary">
                            Vezi Consultații/Prescripții
                        </a>

                        <a th:href="@{/vizite/delete/{id}(id=${vizita.vizitaId})}" 
                            class="btn btn-sm btn-danger ms-1"
                            sec:authorize="hasRole('ADMIN')"
                            onclick="return confirm('Sigur vrei să ștergi această vizită? Vor fi șterse și consultațiile aferente!')">
                            Șterge
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <div th:if="${#lists.isEmpty(vizite)}" class="alert alert-info">
            Nu există vizite înregistrate pentru acest pacient.
        </div>
    </div>
</body>
</html>
